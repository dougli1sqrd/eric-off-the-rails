name: Jekyll site CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build the site in the jekyll/builder container
      run: |
        cd "${{ github.workspace }}"
        ./jekyll-build.sh -t jekyll_build
        docker run --rm --init -u $(id -u):$(id -g) -v ./static:/srv/jekyll "jekyll_build" bundle exec jekyll build --future
    - name: Show Contents
      run: |
        echo ${{ github.workspace }}
        ls -l ${{ github.workspace }}
        ls -l ${{ github.workspace }}/static/_site/

    - name: Deploy to server
      id: deploy
      uses: Pendect/action-rsyncer@v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.DEPLOY_KEY}}
      with:
        flags: '-avr --delete'
        options: ''
        ssh_options: '-p 22010'
        src: './static/_site/'
        dest: 'ericoff@web.electricembers.net:/home/ericoff/public_html/'

    - name: Deploy scripts to server
      id: deploy-scripts
      uses: Pendect/action-rsyncer@v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.DEPLOY_KEY}}
      with:
        flags: '-avr --delete'
        options: ''
        ssh_options: '-p 22010'
        src: './bin/'
        dest: 'ericoff@web.electricembers.net:/home/ericoff/cgi-bin/'
    - name: Display status from deploy
      if: ${{ always() }}
      run: echo "${{ steps.deploy.outputs.status }}"
